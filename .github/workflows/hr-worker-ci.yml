name: hr-worker CI

on:
  push:
    paths:
      - "hr-worker/**"
      - ".github/workflows/hr-worker-ci.yml"
  pull_request:
    paths:
      - "hr-worker/**"
      - ".github/workflows/hr-worker-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
