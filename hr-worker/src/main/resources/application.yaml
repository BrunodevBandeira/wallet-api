server:
  port: 8081
  error:
    include-stacktrace: never
spring:
  application:
    name: hr-worker
  datasource:
    url: jdbc:h2:mem:testdb
    diver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
       mode:always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka